[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perf_eval_cs_fl"
version = "1.0.0"
description = ""
license = "Apache-2.0"
dependencies = [
    "flwr[simulation]>=1.15.2",
    "flwr-datasets[vision]>=0.5.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "datasets",
    "numpy",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "filipe"

[tool.flwr.app.components]
serverapp = "server_app:app"
clientapp = "client_app:app"

[tool.flwr.app.config]

#-----------------------------------------------------------------

# GLOBAL & SEED
seed = 1
root-model-dir = "./model/"
root-profiles-dir = "./profiles/"
root-outputs-dir = "./outputs/"
# Se definido, agrupa todos os runs do experimento em outputs/<exp-tag>/
# (em vez de separar por data). Vazio = comportamento antigo (por data).
exp-tag = ""

# PROFILES
# "./utils/profile/Mobilenet_v2.json"
# "./utils/profile/Shufflenet_v2_x0_5.json"
# "./utils/profile/Resnext50_32x4d.json"
# "./utils/profile/Lstm.json"
# "./utils/profile/CRNNResNetAttn.json"
# "./utils/profile/simplecnn_scaled.json"
devices-profile-path = "./utils/profile/Shufflenet_v2_x0_5.json"

# MODELS — teste local minimal com Mobilenet_v2
# "simplecnn"
# "Mobilenet_v2"
# "Shufflenet_v2_x0_5"
# "Resnext50_32x4d"
# "Lstm"
# "CRNNResNetAttn"
model-name = "Shufflenet_v2_x0_5"
# shape: CIFAR10 32x32 vs ImageNet-style 224x224 (Mobilenet)
#input-shape = "(3, 32, 32)"
input-shape = "(3,224,224)"
# classes
num-classes = 10 #CRNNResNetAttn: 12 Lstm: - Others: 10
# model independent
epochs = 10 #real deploy: 5
learning-rate = 1e-2 #CRNNResNetAttn: 3e-4 Others: 1e-3
weight-decay = 1e-5
decay-step = 10
momentum = 0.9

prefer-time = "EQUAL" # SLOW, EQUAL, FAST

# DATASET
# "flwrlabs/shakespeare"
# "uoft-cs/cifar10"
# "speech_commands"
hugginface-id = "uoft-cs/cifar10"
dir-alpha = 1 #0.1, 0.3, 1.0
batch-size = 8

# strategy — teste local minimal (poucos clientes/rodadas para passar do [INIT])
aggregation-name = "fedavg"
participants-name = "constant"
selection-name = "fedcs"

num-clients = 100
num-rounds = 100
num-participants = 10
num-evaluators = 10
num-candidates = 2

#TwoPhase
num-participants-bcp = 5
num-participants-acp = 5
smooth-window = 5
tau-deriv = 0.005
cp=25

#Critical
is-critical = false

#Recombination
mult-factor = 1
prioritize-sim = true

#FedCS
# *selection-name = "fedcs"
# Para poda dinâmica, use: selection-name = "fedcs_dynamic"
pretrain-rounds = 90     # acts as max when adaptive-pretrain=true
beta = 0.65              # Limiar para considerar uma classe como "Large-Capacity"
pf = 0.5                 # Taxa de poda alta (para classes grandes)
pl = 0.2                 # Taxa de poda baixa (para classes pequenas/restantes)
prune-rounds = ""        # Ex.: "10,50" ou "30,70" (usado em fedcs_dynamic)
random-prune = false     # ablação: poda aleatória (mesma taxa) em vez de DC

# Adaptive pretrain (only used when adaptive-pretrain = true)
adaptive-pretrain = true    # toggle: auto-detect when to stop pretraining
min-pretrain-rounds = 20    # minimum pretrain rounds before checking convergence
pretrain-tau = 0.02         # MA improvement threshold to consider "plateau"
pretrain-window = 10        # sliding window size for MA comparison

# FedCS capacity budget (FedCore-style): aligns samples-per-client to device capacity.
# When enabled, the fixed pf/pl rates are replaced by a per-client target K_i derived
# from a per-round budget; the DC score still decides WHICH samples are kept.
# budget-mode: "off" (fixed pf/pl, default) | "time" (uses training_ms) | "energy" (uses training_mJ)
budget-mode = "off"
# If > 0: tau = this percentile of the clients' full-data round cost (auto-adapts to the fleet).
budget-percentile = 70.0
# Absolute tau (ms if time-mode, mJ if energy-mode). Used only when budget-percentile <= 0.
budget-value = 0.0
# Minimum number of samples a straggler must keep after budget pruning.
budget-min-keep = 1

# FedCS adaptive pruning RATE (per-client, resource-aware). Keeps the full double
# pruning (DC + per-class rebalancing) but scales pf/pl per client by capacity:
# slow/heavy clients prune more, fast ones prune less. ALL clients still prune.
# adaptive-rate: false (use fixed pf/pl, default) | true (per-client rates)
adaptive-rate = false
# Cost dimension used to rank capacity: "time" (training_ms) | "energy" (training_mJ).
adaptive-rate-cost = "time"
# Multiplier range applied to base pf/pl: fastest client -> min, slowest -> max.
adaptive-rate-min = 0.7
adaptive-rate-max = 1.3
# Upper cap on the resulting per-client rate (avoids pruning ~everything).
adaptive-rate-cap = 0.95

# Per-class floor (N8): keep at least max(prune-floor-abs, ceil(prune-floor-frac * n_k))
# samples per class after pruning, so rare/mid classes are not decimated in non-IID.
# Defaults (abs=1, frac=0.0) reproduce the legacy ">=1 per class" behavior exactly.
prune-floor-abs = 1
prune-floor-frac = 0.0

[tool.flwr.federations]
default = "local-simulation"

# IMPORTANT: num-supernodes must be >= num-clients. The server waits for num_clients
# to connect; if fewer supernodes exist, it hangs after [INIT] with no error.
# local-simulation: minimal (3 clients) para teste Mobilenet_v2.
[tool.flwr.federations.local-simulation]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0
options.backend.init_args.num_cpus = 2
options.backend.init_args.num_gpus = 0

# Use this when running with num-clients=100 (e.g. FedCS pretrain sweeps) locally.
[tool.flwr.federations.local-simulation-100]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0
options.backend.init_args.num_cpus = 8
options.backend.init_args.num_gpus = 0

[tool.flwr.federations.gpu-sim-dl]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.5
options.backend.init_args.num_cpus = 25
options.backend.init_args.num_gpus = 3

# Paper CIFAR-10 setup: 10 clients with FULL participation. num-supernodes MUST
# equal num-clients (=10); otherwise supernode ids > num-clients request a
# partition that doesn't exist (KeyError in the Dirichlet partitioner).
# client-resources.num-gpus=0.3 lets all 10 clients run concurrently on 3 GPUs.
[tool.flwr.federations.gpu-sim-dl-10]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.3
options.backend.init_args.num_cpus = 25
options.backend.init_args.num_gpus = 3

# Single-GPU variant for 10 clients (e.g. thedeep with 1x RTX 6000).
# 0.1 GPU per client → all 10 fit on 1 GPU. num_cpus capped to available cores.
[tool.flwr.federations.gpu-sim-dl-10-1gpu]
options.num-supernodes = 10
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.1
options.backend.init_args.num_cpus = 10
options.backend.init_args.num_gpus = 1

[tool.flwr.federations.gpu-sim-dl-16]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.5
options.backend.init_args.num_cpus = 25
options.backend.init_args.num_gpus = 6

[tool.flwr.federations.gpu-sim-dl-17]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 2
options.backend.client-resources.num-gpus = 0.5
options.backend.init_args.num_cpus = 25
options.backend.init_args.num_gpus = 3

[tool.flwr.federations.gpu-sim-dl-02]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.5
options.backend.init_args.num_cpus = 10
options.backend.init_args.num_gpus = 2

[tool.flwr.federations.gpu-sim-dl-24]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.5
options.backend.init_args.num_cpus = 10
options.backend.init_args.num_gpus = 3

[tool.flwr.federations.gpu-sim-lrc]
options.num-supernodes = 100
options.backend.client-resources.num-cpus = 1
options.backend.client-resources.num-gpus = 0.2
options.backend.init_args.num_cpus = 10
options.backend.init_args.num_gpus = 1